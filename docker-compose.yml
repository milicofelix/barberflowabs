services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barberflow_abs_app
    working_dir: /workspace/barberFlowABS
    init: true
    tty: true
    stdin_open: true
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-mysql://barberflow:barberflow@infra-mysql-1:3306/uniflow_abs}
      JWT_SECRET: ${JWT_SECRET:-barberflow_abs_dev_secret}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-milicofelix@gmail.com}
      NOTIFICACOES_WORKER_ATIVO: ${NOTIFICACOES_WORKER_ATIVO:-true}
      NOTIFICACOES_WORKER_INTERVALO_MS: ${NOTIFICACOES_WORKER_INTERVALO_MS:-5000}
      NOTIFICACOES_CALLBACK_SECRET: ${NOTIFICACOES_CALLBACK_SECRET:-uniflow-simulado-local}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-uniflow_abs_dev_webhook_secret}
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      # O Expo usa esta variavel para anunciar ao celular o IP da maquina host,
      # em vez do IP interno do container (por exemplo, 172.24.0.4).
      REACT_NATIVE_PACKAGER_HOSTNAME: ${EXPO_PACKAGER_HOSTNAME:-}
      API_URL: ${API_URL:-http://localhost:4000}
      RCT_METRO_PORT: 8081
      # Ajuda file watchers de Next/Nest/Expo a perceber alterações em bind mounts.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      TURBO_DAEMON: "false"
    ports:
      - "3000:3000"   # Next.js frontend
      - "4000:4000"   # NestJS backend
      - "8081:8081"   # Expo / Metro / web
      - "19000:19000" # Expo
      - "19001:19001" # Expo
      - "19002:19002" # Expo DevTools
      - "19006:19006" # Expo web (compatibilidade)
    volumes:
      - .:/workspace/barberFlowABS
      - barberflow_node_modules:/workspace/barberFlowABS/node_modules
    # O schema fica em bind mount e pode mudar sem reconstruir a imagem. Gere o
    # client antes dos processos para impedir um Prisma Client desatualizado.
    command: sh -lc "yarn --cwd apps/backend prisma:generate && yarn turbo dev --ui=stream"
    restart: unless-stopped
    networks:
      - shared

volumes:
  barberflow_node_modules:

networks:
  shared:
    external: true
    name: shared_net
