services:
  mysql:
    image: mysql:8.0
    container_name: barberflow_abs_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-barberflow_abs}
      MYSQL_USER: ${MYSQL_USER:-barberflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-barberflow}
    ports:
      - "3307:3306"
    volumes:
      - barberflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barberflow_abs_app
    working_dir: /workspace/barberFlowABS
    init: true
    tty: true
    stdin_open: true
    environment:
      NODE_ENV: development
      DATABASE_URL: mysql://barberflow:barberflow@mysql:3306/barberflow_abs
      JWT_SECRET: ${JWT_SECRET:-barberflow_abs_dev_secret}
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      RCT_METRO_PORT: 8081
      # Ajuda file watchers de Next/Nest/Expo a perceber alterações em bind mounts.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"   # Next.js frontend
      - "4000:4000"   # NestJS backend
      - "8081:8081"   # Expo / Metro / web
      - "19000:19000" # Expo
      - "19001:19001" # Expo
      - "19002:19002" # Expo DevTools
      - "19006:19006" # Expo web (compatibilidade)
    volumes:
      - .:/workspace/barberFlowABS
      - barberflow_node_modules:/workspace/barberFlowABS/node_modules
    command: yarn turbo dev --ui=stream
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  barberflow_node_modules:
  barberflow_mysql_data:
